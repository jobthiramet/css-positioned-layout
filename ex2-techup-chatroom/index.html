<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <title>TechUp Chatroom</title>
</head>
<body>

  <div class="chatroom-container">
    
    <div class="chatroom-header">
      <h2>Techup Chatroom</h2>
    </div>

    <div class="chat-body">
      
      <div class="chat-row row-right">
        <div class="bubble bubble-green bubble-tail">
          สวัสดีดีจ้า
        </div>
      </div>

      <div class="chat-row row-right">
        <div class="bubble bubble-light-gray">
          Coding สนุกจังเลย
          <button class="close-btn">x</button>
        </div>
      </div>

      <div class="chat-row row-right">
        <div class="bubble bubble-green bubble-tail">
          🤩 😍
        </div>
      </div>

      <div class="chat-row row-left">
        <div class="bubble bubble-dark-gray">
          🤩
        </div>
      </div>

      <div class="chat-row row-left">
        <div class="bubble bubble-dark-gray">
          🐤
        </div>
      </div>

    </div>

  </div>

</body>
</html>
